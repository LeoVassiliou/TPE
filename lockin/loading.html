<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Loading Protocol — Lock In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0d14;
    --panel-solid: #121724;
    --panel-raised: #1a2132;
    --line: #26304a;
    --amber: #ffb454;
    --amber-dim: #ffb45433;
    --green: #6ee7b7;
    --green-dim: #6ee7b722;
    --blue: #7dd3fc;
    --red: #f87171;
    --red-dim: #f8717122;
    --text: #e7ebf5;
    --text-dim: #8290ad;
    --text-faint: #4c5876;
    --font-display: 'Big Shoulders Display', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: radial-gradient(ellipse 1200px 800px at 50% -10%, #1a2035 0%, var(--bg) 55%);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 20px 16px 80px;
  }
  .wrap{ max-width: 820px; margin: 0 auto; }
  a{ color: var(--amber); }

  .back{ font-size:12.5px; font-weight:600; text-decoration:none; color: var(--text-dim); display:inline-block; margin-bottom:14px; }
  .back:hover{ color: var(--amber); }

  header{
    display:flex; justify-content: space-between; align-items: flex-end;
    flex-wrap: wrap; gap: 14px; margin-bottom: 18px;
  }
  .brand{
    font-family: var(--font-display); font-weight: 800; font-size: 36px;
    letter-spacing: 0.5px; line-height: 0.95; text-transform: uppercase;
  }
  .sub{ font-family: var(--font-mono); color: var(--text-dim); font-size: 12.5px; margin-top: 6px; }
  .head-r{ text-align:right; font-family: var(--font-mono); font-size:12px; line-height:1.7; }
  .phase-tag{ color: var(--amber); letter-spacing:0.1em; text-transform:uppercase; font-size:10px; }
  .phase-name{ font-family: var(--font-body); font-weight:700; font-size:15px; color: var(--text); }
  .phase-target{ color: var(--text-dim); }

  .datebar{ display:flex; align-items:center; justify-content:center; gap:18px; padding:12px;
    background: var(--panel-solid); border:1px solid var(--line); border-radius:12px; margin-bottom:16px; }
  .datebar .date{ font-family: var(--font-mono); font-size:14px; min-width:190px; text-align:center; }
  .datebar .date em{ color: var(--amber); font-style:normal; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; margin-left:8px; }

  button{
    font-family: var(--font-body); cursor:pointer; border:none; border-radius:7px;
    padding: 7px 12px; font-size: 12px; font-weight:600;
    background: var(--panel-raised); color: var(--text); border:1px solid var(--line);
  }
  button:hover{ border-color: var(--amber); color: var(--amber); }
  button.primary{ background: var(--amber); color:#1a1200; border-color: var(--amber); }
  button.primary:hover{ filter: brightness(1.08); color:#1a1200; }
  button.ghost{ background: transparent; }
  .nav-btn{ width:34px; height:34px; border-radius:50%; padding:0; font-size:15px; }

  .bar-wrap{ padding: 8px 4px 0; }
  .bar{ width:100%; height:auto; display:block; }
  .bar .shaft{ fill: var(--line); }
  .bar .collar{ fill: var(--text-faint); }
  .bar .knurl{ fill: var(--text-faint); }
  .bar .plate.on{ fill: var(--amber); animation: drop .32s cubic-bezier(.2,.9,.3,1) backwards; }
  .bar .plate.off{ fill:none; stroke: var(--line); stroke-width:1.5; stroke-dasharray:3 3; }
  .bar .barlabel{ fill: var(--text-dim); font-family: var(--font-mono); font-size:12px; }
  @keyframes drop{ from{ transform:translateY(-18px); opacity:0; } to{ transform:translateY(0); opacity:1; } }

  .readout{ display:flex; gap:1px; background: var(--line); border-top:1px solid var(--line);
    border-bottom:1px solid var(--line); flex-wrap:wrap; margin-bottom:18px; border-radius: 10px; overflow:hidden; }
  .stat, .floor{ flex:1 1 90px; background: var(--panel-solid); padding:12px 14px; }
  .stat-k, .floor-k{ font-family: var(--font-mono); font-size:10px; letter-spacing:0.1em;
    text-transform:uppercase; color: var(--text-dim); }
  .stat-v, .floor-v{ font-family: var(--font-display); font-weight:700; font-size:23px; margin-top:3px; }
  .stat-t{ font-family: var(--font-mono); font-size:11px; color: var(--text-dim); margin-top:2px; }
  .floor.on{ background: var(--green-dim); }
  .floor.on .floor-k{ color: var(--green); }
  .floor.on .floor-v{ color: var(--green); }

  .tabs{ display:flex; gap:0; background: var(--panel-solid); border:1px solid var(--line); border-radius:10px;
    overflow:hidden; margin-bottom:20px; }
  .tab{ flex:1; background:none; border:none; border-radius:0; border-bottom:3px solid transparent; padding:12px 8px;
    font-size:13px; font-weight:600; letter-spacing:0.03em; color: var(--text-dim); }
  .tab:hover{ color: var(--text); border-color: transparent; }
  .tab.on{ color: var(--amber); border-bottom-color: var(--amber); background: var(--panel-raised); }

  .note{ background: var(--panel-raised); color: var(--text-dim); padding:16px 18px; font-size:13.5px; line-height:1.6;
    margin-bottom:20px; border-left:4px solid var(--amber); border-radius: 0 10px 10px 0; }
  .note strong{ color: var(--text); }

  .block{ margin-bottom:24px; }
  .block-h{ display:flex; align-items:baseline; gap:12px; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  .block-h h3{ font-family: var(--font-display); font-weight:700; font-size:16px; margin:0; letter-spacing:0.01em; }
  .time{ font-family: var(--font-mono); font-size:12px; color: var(--amber); }
  .anchor{ margin-left:auto; font-family: var(--font-mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    color:#1a1200; background: var(--amber); padding:2px 7px; border-radius:5px; }
  .block-p{ font-size:13px; color: var(--text-dim); line-height:1.6; margin:0 0 12px; }

  .opts{ display:grid; gap:8px; }
  .opt{ text-align:left; background: var(--panel-solid); border:1px solid var(--line); border-left:3px solid var(--line);
    border-radius:10px; padding:12px 14px; display:block; width:100%; }
  .opt:hover{ border-color: var(--text-dim); }
  .opt.on{ border-color: var(--amber); border-left-color: var(--amber); background: var(--panel-raised); }
  .opt-top{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .opt-n{ font-weight:700; font-size:14px; }
  .opt-k{ font-family: var(--font-mono); font-size:13px; color: var(--amber); }
  .opt-d{ font-size:12px; color: var(--text-dim); margin-top:4px; line-height:1.5; }
  .opt-m{ font-family: var(--font-mono); font-size:11px; color: var(--text-faint); margin-top:6px; }

  .topups{ display:grid; gap:1px; background: var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .topup{ display:flex; align-items:center; gap:10px; background: var(--panel-solid); padding:9px 12px; font-size:13px; }
  .topup.on{ background: var(--panel-raised); box-shadow: inset 3px 0 0 var(--amber); }
  .topup-n{ flex:1; }
  .topup-k{ font-family: var(--font-mono); font-size:12px; color: var(--text-dim); }
  .qty{ display:flex; align-items:center; gap:2px; }
  .qty button{ width:26px; height:26px; padding:0; font-size:14px; line-height:1; }
  .qty span{ font-family: var(--font-mono); width:22px; text-align:center; font-size:13px; }

  .rest{ background: var(--panel-solid); border-left:4px solid var(--amber); border-radius: 0 10px 10px 0; padding:20px; }
  .rest h3{ font-family: var(--font-display); font-size:18px; margin:0 0 8px; }
  .rest p{ font-size:14px; line-height:1.65; color: var(--text-dim); margin:0; }

  .ex{ background: var(--panel-solid); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
  .ex.on{ border-left:3px solid var(--green); background: var(--panel-raised); }
  .ex-h{ display:flex; gap:12px; align-items:flex-start; }
  .check{ width:26px; height:26px; flex:none; border:2px solid var(--line); border-radius:6px; background:none; font-size:14px; line-height:1; color: var(--text); padding:0; }
  .check.on{ background: var(--green); border-color: var(--green); color:#0a1f16; }
  .ex-n h4{ margin:0; font-size:15px; font-weight:700; }
  .ex-n span{ font-family: var(--font-mono); font-size:12px; color: var(--amber); }
  .ex-note{ font-size:12.5px; color: var(--text-dim); line-height:1.55; margin:9px 0 0 38px; }
  .ex-log{ display:flex; gap:12px; align-items:flex-end; margin:12px 0 0 38px; flex-wrap:wrap; }
  .ex-log label{ font-family: var(--font-mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    color: var(--text-dim); display:flex; flex-direction:column; gap:4px; }
  .ex-log input{ width:70px; padding:6px 8px; border:1px solid var(--line); background: var(--panel-raised);
    font-family: var(--font-mono); font-size:13px; color: var(--text); border-radius:6px; }
  .prev{ font-family: var(--font-mono); font-size:11px; color: var(--text-dim); padding-bottom:6px; }
  .prev strong{ color: var(--amber); }

  textarea{ width:100%; min-height:76px; padding:10px; border:1px solid var(--line); border-radius:8px;
    background: var(--panel-solid); font-family: var(--font-body); font-size:13px; line-height:1.6; color: var(--text); resize:vertical; }

  .weigh-in{ display:flex; align-items:baseline; gap:8px; }
  .weigh-in input{ width:120px; padding:9px 12px; border:1px solid var(--line); border-radius:8px;
    background: var(--panel-solid); font-family: var(--font-mono); font-size:24px; color: var(--text); }
  .weigh-in span{ font-family: var(--font-mono); color: var(--text-dim); }
  .date-input{ padding:8px 10px; border:1px solid var(--line); border-radius:8px; background: var(--panel-solid);
    font-family: var(--font-mono); font-size:13px; color: var(--text); }

  .trend-nums{ display:flex; gap:24px; margin-bottom:14px; flex-wrap:wrap; }
  .trend-nums div{ display:flex; flex-direction:column; }
  .trend-nums b{ font-family: var(--font-display); font-size:24px; }
  .trend-nums span{ font-family: var(--font-mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color: var(--text-dim); }
  .spark{ width:100%; height:auto; background: var(--panel-solid); border:1px solid var(--line); border-radius:10px; padding:6px; }
  .spark .axis{ stroke: var(--line); stroke-width:1; }
  .spark .sparkline{ fill:none; stroke: var(--amber); stroke-width:2.5; stroke-linejoin:round; }
  .spark .dot{ fill: var(--amber); }
  .verdict{ font-size:13.5px; line-height:1.6; margin:12px 0 0; padding-left:14px; border-left:3px solid var(--line); }
  .verdict.slow{ border-color: var(--red); color: var(--red); }
  .verdict.fast{ border-color: var(--amber); color: var(--amber); }
  .verdict.ok{ border-color: var(--green); color: var(--green); }

  .why{ margin-bottom:24px; padding-bottom:20px; border-bottom:1px solid var(--line); }
  .why:last-child{ border-bottom:none; }
  .why h3{ font-family: var(--font-display); font-size:16px; margin:0 0 8px; line-height:1.25; }
  .why p{ font-size:13.5px; line-height:1.7; color: var(--text-dim); margin:0; }

  footer{ text-align:center; color: var(--text-faint); font-size:11px; margin-top: 30px; }

  @media (max-width:560px){
    .brand{ font-size:28px; }
    .head-r{ text-align:left; }
    .ex-note, .ex-log{ margin-left:0; }
    .stat-v, .floor-v{ font-size:19px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Lock In</a>

  <header>
    <div>
      <div class="brand">THE LOADING<br>PROTOCOL</div>
      <div class="sub">Leo · 52kg → 60kg</div>
    </div>
    <div class="head-r">
      <div class="phase-tag" id="weekTag">Week 1</div>
      <div class="phase-name" id="phaseName">—</div>
      <div class="phase-target" id="phaseTarget">—</div>
    </div>
  </header>

  <div class="datebar">
    <button class="nav-btn" id="prevDay" aria-label="Previous day">←</button>
    <div class="date"><span id="dateLbl">—</span><em id="todayTag"></em></div>
    <button class="nav-btn" id="nextDay" aria-label="Next day">→</button>
  </div>

  <div class="bar-wrap"><svg viewBox="0 0 700 150" class="bar" id="barbell" role="img"></svg></div>

  <div class="readout">
    <div class="stat"><div class="stat-k">kcal</div><div class="stat-v" id="rKcal">0</div><div class="stat-t" id="rKcalT"></div></div>
    <div class="stat"><div class="stat-k">protein</div><div class="stat-v" id="rP">0</div><div class="stat-t" id="rPT"></div></div>
    <div class="stat"><div class="stat-k">carbs</div><div class="stat-v" id="rC">0</div></div>
    <div class="stat"><div class="stat-k">fat</div><div class="stat-v" id="rF">0</div></div>
    <div class="floor" id="floorPill"><div class="floor-k">floor</div><div class="floor-v" id="floorV">not yet</div></div>
  </div>

  <nav class="tabs">
    <button class="tab" data-tab="fuel">Fuel</button>
    <button class="tab" data-tab="train">Train</button>
    <button class="tab" data-tab="weigh">Weigh</button>
    <button class="tab" data-tab="why">Why</button>
  </nav>

  <main id="main"></main>

  <footer>leovassiliou.co.uk/lockin/loading — a day with three anchor meals and one session is a day that counts.</footer>
</div>

<script>
/* ============ DATA ============ */
const PHASES = [
  { wk:[1,1],  kcal:2500, p:110, label:'Phase 1 — Adjust',       note:'+250 over maintenance. One week only. The job this week is hitting five eating windows on schedule, not the number itself. If this feels easy by Thursday, move to Phase 2 early.' },
  { wk:[2,3],  kcal:2700, p:115, label:'Phase 2 — Load',         note:'+450. The scale should begin moving. Food volume starts feeling normal around here.' },
  { wk:[4,99], kcal:2900, p:120, label:'Phase 3 — Full surplus', note:'+650. Target rate: 0.5–0.7kg per week. Anything faster is mostly fat and water.' },
];
const phaseForWeek = (w) => PHASES.find(p => w >= p.wk[0] && w <= p.wk[1]) || PHASES[2];

const MEALS = {
  breakfast: [
    { id:'b1', n:'Overnight oats', d:'90g oats · 300ml whole milk · 30g peanut butter · 1 banana', p:29, c:107, f:33 },
    { id:'b2', n:'Eggs & avocado on sourdough', d:'3 eggs · 2 slices sourdough · ½ avocado · 10g butter · 200ml milk', p:36, c:65, f:41 },
    { id:'b3', n:'Bagel & smoked salmon', d:'1 bagel · 40g cream cheese · 60g smoked salmon · 300ml whole milk', p:38, c:64, f:30 },
  ],
  lunch: [
    { id:'l1', n:'Chicken thigh & rice', d:'150g chicken thigh · 100g dry white rice · 10ml olive oil · veg', p:39, c:85, f:27 },
    { id:'l2', n:'Beef mince pasta', d:'150g 5% mince · 120g dry pasta · passata · 15ml olive oil · 20g parmesan', p:53, c:92, f:31 },
    { id:'l3', n:'Salmon & couscous', d:'150g salmon · 100g dry couscous · 10ml olive oil · veg', p:49, c:84, f:30 },
  ],
  shake: [
    { id:'s1', n:'Milk & banana shake', d:'400ml whole milk · 1 banana · 20g honey · 20g oats', p:16, c:75, f:16 },
    { id:'s2', n:'PB & jam sandwich', d:'2 slices white bread · 40g peanut butter · 20g jam', p:16, c:61, f:22 },
    { id:'s3', n:'Yogurt & granola', d:'200g full-fat Greek yogurt · 50g granola · 15g honey', p:19, c:49, f:20 },
    { id:'s4', n:'Trail mix & milk', d:'50g nuts and raisins · 300ml whole milk', p:17, c:34, f:29 },
  ],
  dinner: [
    { id:'d1', n:'Mince & potatoes', d:'150g 15% beef mince · 300g potatoes · 10ml olive oil · greens', p:35, c:55, f:34 },
    { id:'d2', n:'Chicken curry & rice', d:'150g chicken thigh · 100g dry basmati · 80ml coconut milk · veg', p:40, c:87, f:34 },
    { id:'d3', n:'Steak & sweet potato', d:'180g sirloin · 300g sweet potato · 10g butter · greens', p:56, c:64, f:24 },
    { id:'d4', n:'Salmon & noodles', d:'150g salmon · 100g dry egg noodles · 10ml sesame oil · veg', p:48, c:78, f:31 },
  ],
  evening: [
    { id:'e1', n:'Yogurt, honey & walnuts', d:'170g full-fat Greek yogurt · 15g honey · 15g walnuts', p:14, c:20, f:18 },
    { id:'e2', n:'Cheese & crackers', d:'40g cheddar · 6 crackers', p:14, c:28, f:20 },
    { id:'e3', n:'Milk & dark chocolate', d:'300ml whole milk · 30g dark chocolate', p:12, c:27, f:23 },
    { id:'e4', n:'Cottage cheese & banana', d:'200g cottage cheese · 15g honey · 1 banana', p:24, c:47, f:8 },
  ],
};
const SLOTS = [
  { key:'breakfast', label:'Breakfast', time:'07:30', anchor:true },
  { key:'lunch', label:'Lunch', time:'12:30', anchor:true },
  { key:'shake', label:'Afternoon / post-training', time:'16:00', anchor:false },
  { key:'dinner', label:'Dinner', time:'19:30', anchor:true },
  { key:'evening', label:'Before bed', time:'22:00', anchor:false },
];
const TOPUPS = [
  { id:'t1', n:'Glass of whole milk (200ml)', p:7, c:9, f:7 },
  { id:'t2', n:'Tbsp olive oil on the meal', p:0, c:0, f:15 },
  { id:'t3', n:'Handful of nuts (30g)', p:6, c:6, f:16 },
  { id:'t4', n:'Peanut butter (30g)', p:7, c:6, f:15 },
  { id:'t5', n:'Banana', p:1, c:27, f:0 },
  { id:'t6', n:'Dried dates (40g)', p:1, c:27, f:0 },
  { id:'t7', n:'Cheddar (30g)', p:8, c:0, f:10 },
  { id:'t8', n:'Two slices bread & butter', p:8, c:40, f:10 },
];
const SESSIONS = {
  1: { id:'lowerA', name:'Lower A', focus:'Squat pattern', ex:[
    { n:'Back squat', s:4, r:'5–8', note:'The single most important lift on the plan. Everything else is support.' },
    { n:'Romanian deadlift', s:3, r:'8–10', note:'Hamstrings and lower back. Bar stays close, knees soft, feel the stretch.' },
    { n:'Leg press', s:3, r:'10–12', note:'Volume with no balance demand — pure quad growth once squats have taken the edge off.' },
    { n:'Lying leg curl', s:3, r:'10–12', note:"Squats and RDLs don't train knee flexion. This does." },
    { n:'Standing calf raise', s:4, r:'10–15', note:'Full stretch at the bottom, pause at the top. Calves respond to stretch, not bounce.' },
    { n:'Plank', s:3, r:'30–45s', note:'Bracing carries over directly to squat and deadlift.' },
  ]},
  2: { id:'upperA', name:'Upper A', focus:'Horizontal push & pull', ex:[
    { n:'Barbell bench press', s:4, r:'5–8', note:'Chest thickness. Shoulder blades pinned back and down throughout.' },
    { n:'Chest-supported row', s:4, r:'6–10', note:'Chest-supported removes the lower back as a limiter, so the back actually gets trained.' },
    { n:'Incline dumbbell press', s:3, r:'8–12', note:'Upper chest is what makes a narrow frame read as broad.' },
    { n:'Lat pulldown', s:3, r:'10–12', note:'Width. Drive the elbows down, not the hands.' },
    { n:'Cable fly', s:2, r:'12–15', note:'Stretch under load. Slow on the way out.' },
    { n:'Face pull', s:3, r:'15–20', note:'Shoulder health. Non-negotiable when benching twice a week.' },
  ]},
  3: { id:'rest', name:'Rest', focus:'Full rest day', ex:[] },
  4: { id:'lowerB', name:'Lower B', focus:'Hinge pattern', ex:[
    { n:'Deadlift', s:3, r:'4–6', note:'Low reps deliberately. Heavy deadlifts are systemically expensive — three hard sets is enough.' },
    { n:'Bulgarian split squat', s:3, r:'8–10', note:'Fixes side-to-side imbalance and builds glutes. It will feel disproportionately hard.' },
    { n:'Hip thrust', s:3, r:'8–12', note:"Direct glute loading in a position squats can't reach." },
    { n:'Leg extension', s:3, r:'12–15', note:'Isolated quads, low fatigue cost. Pause a beat at the top.' },
    { n:'Seated calf raise', s:4, r:'12–15', note:'Bent knee targets soleus — the other half of the calf.' },
    { n:'Hanging knee raise', s:3, r:'10–15', note:'Control the lowering. Swinging trains nothing.' },
  ]},
  5: { id:'upperB', name:'Upper B', focus:'Vertical push & pull', ex:[
    { n:'Overhead press', s:4, r:'5–8', note:"Shoulder width is what makes a small frame look built. Squeeze glutes, don't lean back." },
    { n:'Pull-up (assisted or weighted)', s:4, r:'5–10', note:'At 52kg he has a real advantage here. Use it.' },
    { n:'Dumbbell shoulder press', s:3, r:'8–12', note:'Greater range than the barbell, easier on the shoulder joint.' },
    { n:'Seated cable row', s:3, r:'10–12', note:'Mid-back thickness. Pause a second with the handle at the ribs.' },
    { n:'Lateral raise', s:3, r:'12–15', note:'Side delts are the widest visual return per unit of effort on the whole plan.' },
    { n:'Rear delt fly', s:3, r:'15–20', note:'Balances all the pressing and holds the shoulders back at rest.' },
  ]},
  6: { id:'pump', name:'Arms, delts & core', focus:'Short session — 40 minutes', ex:[
    { n:'Incline dumbbell curl', s:3, r:'10–12', note:'Stretched-position biceps work. The hardest and most productive curl variation.' },
    { n:'Overhead cable extension', s:3, r:'10–12', note:'Long head of the triceps — two thirds of arm size.' },
    { n:'Hammer curl', s:3, r:'10–12', note:'Brachialis. Pushes the biceps up and widens the arm from the front.' },
    { n:'Dips or close-grip bench', s:3, r:'8–12', note:'Heavy compound triceps to finish the pressing week.' },
    { n:'Lateral raise', s:4, r:'12–20', note:'Second dose this week. Side delts recover fast and tolerate frequency.' },
    { n:'Cable crunch', s:3, r:'12–15', note:'Loaded abs grow. Bodyweight crunches at this size will not.' },
  ]},
  0: { id:'rest', name:'Rest', focus:'Full rest day', ex:[] },
};
const WHY = [
  { h:'Nineteen is the best year he will ever have for this', b:'Testosterone is at or near lifetime peak, recovery between sessions is faster than it will ever be again, and he has never trained — so the novice adaptation window is fully intact. The same programme run at 30 produces perhaps half the result for the same effort. This is not pressure, it’s leverage: the work is unusually well paid right now. It stays well paid for two or three years and then the rate quietly drops.' },
  { h:'Why the ramp is short', b:'A 19-year-old at 52kg is usually not someone who can’t eat — he’s someone who doesn’t eat on any schedule. Skipped breakfast, nothing until two, a large late dinner, then nothing. The capacity is there; the structure isn’t. So week one is about hitting five eating windows rather than hitting a number, and the calories climb quickly after that. If he genuinely does have low appetite and early fullness, hold each phase an extra week and lean harder on the shake and the top-ups — liquid calories bypass the fullness problem almost entirely.' },
  { h:'Alcohol is the single biggest threat to this plan', b:'Worth being blunt, because at 19 this is the realistic failure point. A heavy night costs him roughly four ways at once: several hundred calories that arrive with no protein attached, badly disrupted deep sleep on the night that matters most for recovery, blunted muscle protein synthesis for around 24 hours afterwards, and a Saturday and Sunday where he trains poorly or not at all and eats maybe 1,500 kcal. One night out can erase most of a week’s surplus. He doesn’t have to stop drinking — but one night a week rather than two, and eating properly the following day rather than writing it off, is probably worth more than any other single change available to him.' },
  { h:'Sleep is a training variable', b:'Most growth hormone release happens in the deep sleep of the first few hours. Under seven hours consistently, testosterone drops measurably in young men within a week, appetite regulation goes haywire, and training performance falls. Eight to nine hours on a consistent schedule will do more for him than every supplement on the market combined. This is the boring answer and it is also the true one.' },
  { h:'Calorie density is the whole game', b:"The hardgainer's real problem is volume, not willpower. Chicken breast, brown rice and broccoli is 500 kcal of food that fills the stomach like 900. Whole milk instead of skimmed, white rice instead of brown, olive oil on everything, nut butter, dried fruit — every one of these adds calories without adding bulk. This is why the plan looks less 'clean' than a cutting plan. It is supposed to. Fibre and food volume are working against him right now." },
  { h:'Why protein is capped around 120g, not 200g', b:'At 52kg, 120g of protein is 2.3g per kilogram of bodyweight — already above the point where more protein produces more muscle. Protein is also the most filling macronutrient per calorie. Pushing it to 180g would take up stomach space that carbohydrate and fat need in order to create the surplus that actually drives the growth. Protein permits muscle gain; the surplus causes it. Getting this backwards is the most common mistake skinny lifters make.' },
  { h:'The only supplement worth buying', b:"Creatine monohydrate, 5g daily, any time of day, no loading phase needed. It is the most thoroughly studied supplement in sport, it's cheap, and it works — modest strength and training-volume gains, plus a few kilos of intracellular water in the first month. That water weight isn't muscle, but at 52kg it is visible in the mirror, and an early visible win matters more than it should for someone who has never seen his body change. Buy plain monohydrate. Everything else on the shelf is either unnecessary or food in powder form at four times the price." },
  { h:'The double progression rule', b:'Two variables, changed one at a time. Take back squat at 4 sets of 5–8. Start at a weight he can manage for 5 clean reps. Every session, add reps. When all four sets reach 8, add 5kg to the bar and drop back to 5 reps. Upper body lifts go up in 2.5kg jumps. That is the entire progression system. It removes the daily decision about what weight to use, which is exactly the kind of open question that a perfectionist brain will spend twenty minutes optimising.' },
  { h:'How hard each set should be', b:'Stop each set with two to three reps left in reserve — the point where bar speed slows noticeably but form is still clean. Training to absolute failure on every set adds fatigue faster than it adds muscle, and fatigue eats into the surplus. The last set of the last exercise of a session is the only place worth going close to the limit.' },
  { h:"Why there's almost no cardio", b:"Cardio burns calories he is working hard to consume. Walking is fine and good for appetite. Anything beyond that during a bulk is spending money he just earned. If he plays a sport he enjoys, keep it and eat more to cover it — the enjoyment is worth the calories. Don't add cardio for its own sake." },
  { h:'Reading the scale without losing your mind', b:"Daily weight swings 1–2kg on food volume, salt, hydration and bowel timing alone. A single daily reading contains almost no signal. Weigh every morning after the toilet, before eating, and only ever look at the seven-day average. Target: 0.5–0.7kg per week. If the average hasn't moved in ten days, add 200 kcal. If it's climbing faster than 0.8kg per week, most of the excess is fat — hold the calories where they are." },
  { h:'When to stop, and when to check something’s wrong', b:'Run this to roughly 60kg, then hold at maintenance for a month before deciding whether to continue. Twelve to sixteen weeks is a full block. If he genuinely eats 2,900 kcal daily for three weeks and the seven-day average weight hasn’t moved at all, the problem isn’t the plan — that’s the point to see a GP and ask for coeliac serology, thyroid function, ferritin and B12. Coeliac in particular often declares itself in the late teens, and persistent difficulty gaining weight despite real intake is one of the ways it shows up.' },
];

/* ============ HELPERS ============ */
const iso = (d) => { const x = new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const kcalOf = (m) => Math.round(m.p*4 + m.c*4 + m.f*9);
const fmtDate = (dstr) => new Date(dstr+'T12:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
function loadJSON(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function saveJSON(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

/* ============ STATE ============ */
let log = loadJSON('loading_log_v1', {});
let startISO = loadJSON('loading_start_v1', iso(new Date()));
let date = iso(new Date());
let tab = 'fuel';

function day(){ return log[date] || (log[date] = { meals:{}, topups:{}, sets:{}, weight:'', note:'' }); }
function persist(){ saveJSON('loading_log_v1', log); }

function weekNum(){
  const s = new Date(startISO+'T12:00:00');
  const d = new Date(date+'T12:00:00');
  return Math.floor((d-s)/86400000/7) + 1;
}
function currentPhase(){ return phaseForWeek(Math.max(1, weekNum())); }

function totals(){
  let p=0,c=0,f=0;
  const d = day();
  SLOTS.forEach(s=>{
    const chosen = d.meals[s.key];
    if(chosen){ const m = MEALS[s.key].find(x=>x.id===chosen); if(m){ p+=m.p; c+=m.c; f+=m.f; } }
  });
  Object.entries(d.topups||{}).forEach(([id,qty])=>{
    const t = TOPUPS.find(x=>x.id===id);
    if(t && qty){ p+=t.p*qty; c+=t.c*qty; f+=t.f*qty; }
  });
  return { p,c,f, kcal: Math.round(p*4+c*4+f*9) };
}

function trend(){
  const pts = [];
  for(let i=27;i>=0;i--){
    const d = iso(addDays(new Date(date+'T12:00:00'), -i));
    const w = parseFloat((log[d]||{}).weight);
    pts.push({ d, w: isNaN(w) ? null : w });
  }
  const avg = (endIdx) => {
    const win = pts.slice(Math.max(0,endIdx-6), endIdx+1).map(x=>x.w).filter(x=>x!=null);
    return win.length ? win.reduce((a,b)=>a+b,0)/win.length : null;
  };
  const now = avg(27), prev = avg(20);
  return { pts, now, prev, rate: (now!=null && prev!=null) ? now-prev : null };
}

function sessionFor(dateStr){ return SESSIONS[new Date(dateStr+'T12:00:00').getDay()]; }

function adherence(){
  let met = 0;
  for(let i=0;i<7;i++){
    const ds = iso(addDays(new Date(date+'T12:00:00'), -i));
    const e = log[ds]; if(!e) continue;
    const anchors = SLOTS.filter(s=>s.anchor).filter(s=>e.meals && e.meals[s.key]).length;
    const sess = sessionFor(ds);
    const trained = sess.ex.length===0 || Object.keys(e.sets||{}).length>0;
    if(anchors>=3 && trained) met++;
  }
  return Math.round((met/7)*100);
}

function floorMet(){
  const d = day();
  const sess = sessionFor(date);
  const anchors = SLOTS.filter(s=>s.anchor).filter(s=>d.meals[s.key]).length;
  const trained = sess.ex.length===0 || Object.keys(d.sets||{}).length>0;
  return anchors>=3 && trained;
}

/* ============ BARBELL ============ */
function renderBarbell(){
  const t = totals(), phase = currentPhase();
  const PLATE = 250;
  const loadedN = Math.floor(t.kcal/PLATE);
  const targetN = Math.round(phase.kcal/PLATE);
  const max = Math.max(targetN, loadedN);
  const pos = (i) => { const side = i%2===0 ? -1 : 1; const idx = Math.floor(i/2); return 350 + side*(46 + idx*18); };
  const hgt = (i) => Math.max(38, 100 - Math.floor(i/2)*7);
  let plates = '';
  for(let i=0;i<max;i++){
    const on = i<loadedN, x = pos(i), h = hgt(i);
    plates += `<rect x="${x-6.5}" y="${65-h/2}" width="13" height="${h}" rx="3" class="plate ${on?'on':'off'}" style="animation-delay:${i*45}ms"></rect>`;
  }
  const svg = document.getElementById('barbell');
  svg.innerHTML = `
    <rect x="52" y="61" width="596" height="8" rx="4" class="shaft"></rect>
    <rect x="44" y="51" width="10" height="28" rx="2" class="collar"></rect>
    <rect x="646" y="51" width="10" height="28" rx="2" class="collar"></rect>
    ${[...Array(9)].map((_,i)=>`<rect x="${318+i*4}" y="59" width="1.4" height="12" class="knurl"></rect>`).join('')}
    ${plates}
    <text x="350" y="135" text-anchor="middle" class="barlabel">${loadedN} of ${targetN} plates loaded · one plate = 250 kcal</text>
  `;
}

/* ============ RENDER: HEADER ============ */
function renderHeader(){
  const phase = currentPhase();
  document.getElementById('weekTag').textContent = 'Week ' + Math.max(1, weekNum());
  document.getElementById('phaseName').textContent = phase.label;
  document.getElementById('phaseTarget').textContent = phase.kcal + ' kcal · ' + phase.p + 'g protein';
  document.getElementById('dateLbl').textContent = fmtDate(date);
  document.getElementById('todayTag').textContent = date === iso(new Date()) ? 'today' : '';

  const t = totals();
  document.getElementById('rKcal').textContent = t.kcal;
  document.getElementById('rKcalT').textContent = t.kcal >= phase.kcal ? 'target met' : (phase.kcal - t.kcal) + ' to go';
  document.getElementById('rP').textContent = t.p + 'g';
  document.getElementById('rPT').textContent = t.p >= phase.p ? 'target met' : (phase.p - t.p) + 'g to go';
  document.getElementById('rC').textContent = t.c + 'g';
  document.getElementById('rF').textContent = t.f + 'g';

  const met = floorMet();
  document.getElementById('floorPill').className = 'floor' + (met ? ' on' : '');
  document.getElementById('floorV').textContent = met ? 'met' : 'not yet';

  renderBarbell();
}

/* ============ RENDER: FUEL ============ */
function renderFuel(){
  const d = day(), phase = currentPhase(), t = totals();
  const gap = phase.kcal - t.kcal;
  let html = `<div class="note"><strong>${phase.label}.</strong> ${phase.note}</div>`;

  SLOTS.forEach(s=>{
    const chosen = d.meals[s.key];
    html += `<section class="block">
      <div class="block-h"><span class="time">${s.time}</span><h3>${s.label}</h3>${s.anchor?'<span class="anchor">anchor</span>':''}</div>
      <div class="opts">`;
    MEALS[s.key].forEach(m=>{
      html += `<button class="opt ${chosen===m.id?'on':''}" data-slot="${s.key}" data-meal="${m.id}">
        <div class="opt-top"><span class="opt-n">${m.n}</span><span class="opt-k">${kcalOf(m)}</span></div>
        <div class="opt-d">${m.d}</div>
        <div class="opt-m">P ${m.p} · C ${m.c} · F ${m.f}</div>
      </button>`;
    });
    html += `</div></section>`;
  });

  html += `<section class="block">
    <div class="block-h"><h3>Top-ups</h3></div>
    <p class="block-p">${gap>0 ? gap+' kcal short. Add from here rather than cooking again — this is what these exist for.' : 'Target reached. Anything beyond this is optional.'}</p>
    <div class="topups">`;
  TOPUPS.forEach(t2=>{
    const q = (d.topups||{})[t2.id] || 0;
    html += `<div class="topup ${q?'on':''}">
      <span class="topup-n">${t2.n}</span><span class="topup-k">${kcalOf(t2)}</span>
      <div class="qty"><button data-topup="${t2.id}" data-amt="-1">−</button><span>${q}</span><button data-topup="${t2.id}" data-amt="1">+</button></div>
    </div>`;
  });
  html += `</div></section>`;

  document.getElementById('main').innerHTML = html;

  document.querySelectorAll('[data-slot]').forEach(b=>{
    b.onclick = () => {
      const d = day();
      if(d.meals[b.dataset.slot] === b.dataset.meal) delete d.meals[b.dataset.slot];
      else d.meals[b.dataset.slot] = b.dataset.meal;
      persist(); renderAll();
    };
  });
  document.querySelectorAll('[data-topup]').forEach(b=>{
    b.onclick = () => {
      const d = day();
      if(!d.topups) d.topups = {};
      const id = b.dataset.topup, amt = parseInt(b.dataset.amt);
      d.topups[id] = Math.max(0, (d.topups[id]||0) + amt);
      if(!d.topups[id]) delete d.topups[id];
      persist(); renderAll();
    };
  });
}

/* ============ RENDER: TRAIN ============ */
function renderTrain(){
  const d = day(), sess = sessionFor(date);

  if(!sess.ex.length){
    document.getElementById('main').innerHTML = `<div class="rest"><h3>Rest day</h3>
      <p>No training. Eat the full target anyway — rest days are when the growth actually happens, and cutting calories on them is the most common way a bulk quietly stalls. A walk is fine.</p></div>`;
    return;
  }

  let last = null;
  for(let i=1;i<=21 && !last;i++){
    const ds = iso(addDays(new Date(date+'T12:00:00'), -i));
    const e = log[ds]; if(!e) continue;
    if(sessionFor(ds).id === sess.id && Object.keys(e.sets||{}).length) last = { ds, sets: e.sets };
  }

  let html = `<div class="note"><strong>${sess.name} — ${sess.focus}.</strong> Log the heaviest set only. When every set hits the top of the rep range, add 2.5kg upper body or 5kg lower body next time.</div>`;

  sess.ex.forEach(e=>{
    const cur = (d.sets||{})[e.n] || {};
    const prev = last && last.sets[e.n];
    const top = parseInt(e.r.split('–')[1]);
    const ready = prev && parseInt(prev.r) >= top;
    html += `<section class="ex ${cur.done?'on':''}">
      <div class="ex-h">
        <button class="check ${cur.done?'on':''}" data-check="${e.n}">${cur.done?'✓':''}</button>
        <div class="ex-n"><h4>${e.n}</h4><span>${e.s} × ${e.r}</span></div>
      </div>
      <p class="ex-note">${e.note}</p>
      <div class="ex-log">
        <label>kg<input type="number" inputmode="decimal" data-w="${e.n}" value="${cur.w!=null?cur.w:''}" placeholder="${prev&&prev.w||'—'}"></label>
        <label>reps<input type="number" inputmode="numeric" data-r="${e.n}" value="${cur.r!=null?cur.r:''}" placeholder="${prev&&prev.r||'—'}"></label>
        ${prev ? `<div class="prev">last: ${prev.w||'—'}kg × ${prev.r||'—'}${ready?' <strong>— add weight</strong>':''}</div>` : ''}
      </div>
    </section>`;
  });

  html += `<div class="block"><div class="block-h"><h3>Session note</h3></div>
    <textarea id="sessNote" placeholder="Energy, sleep, anything that felt off.">${d.note||''}</textarea></div>`;

  document.getElementById('main').innerHTML = html;

  document.querySelectorAll('[data-check]').forEach(b=>{
    b.onclick = () => {
      const d = day(); if(!d.sets) d.sets = {};
      const n = b.dataset.check;
      d.sets[n] = { ...(d.sets[n]||{}), done: !(d.sets[n]||{}).done };
      persist(); renderAll();
    };
  });
  document.querySelectorAll('[data-w]').forEach(inp=>{
    inp.onchange = () => {
      const d = day(); if(!d.sets) d.sets = {};
      const n = inp.dataset.w;
      d.sets[n] = { ...(d.sets[n]||{}), w: inp.value };
      persist();
    };
  });
  document.querySelectorAll('[data-r]').forEach(inp=>{
    inp.onchange = () => {
      const d = day(); if(!d.sets) d.sets = {};
      const n = inp.dataset.r;
      d.sets[n] = { ...(d.sets[n]||{}), r: inp.value };
      persist();
    };
  });
  const noteEl = document.getElementById('sessNote');
  if(noteEl) noteEl.onchange = () => { day().note = noteEl.value; persist(); };
}

/* ============ RENDER: WEIGH ============ */
function renderWeigh(){
  const d = day(), tr = trend(), adh = adherence();
  const vals = tr.pts.map(p=>p.w).filter(x=>x!=null);
  const lo = vals.length ? Math.min(...vals)-0.5 : 50;
  const hi = vals.length ? Math.max(...vals)+0.5 : 56;
  const span = hi-lo || 1;

  let verdictCls = 'ok', verdictTxt = 'On rate. Change nothing.';
  if(tr.rate == null){ verdictCls=''; verdictTxt = 'Log weight for a fortnight before drawing any conclusion.'; }
  else if(tr.rate < 0.2){ verdictCls='slow'; verdictTxt = 'Gaining too slowly. Add 200 kcal per day and hold for ten days.'; }
  else if(tr.rate > 0.8){ verdictCls='fast'; verdictTxt = 'Gaining fast — a good share of that is fat. Hold calories where they are.'; }

  const points = tr.pts.map((p,i) => p.w==null ? null : `${(i/27)*640+10},${120-((p.w-lo)/span)*100}`).filter(Boolean).join(' ');
  const dots = tr.pts.map((p,i) => p.w==null ? '' : `<circle cx="${(i/27)*640+10}" cy="${120-((p.w-lo)/span)*100}" r="3.5" class="dot"></circle>`).join('');

  document.getElementById('main').innerHTML = `
    <div class="block">
      <div class="block-h"><h3>This morning</h3></div>
      <p class="block-p">After the toilet, before eating or drinking. Same time daily.</p>
      <div class="weigh-in"><input type="number" step="0.1" inputmode="decimal" id="weightInput" value="${d.weight||''}" placeholder="52.0"><span>kg</span></div>
    </div>
    <div class="block">
      <div class="block-h"><h3>Seven-day average</h3></div>
      <div class="trend-nums">
        <div><b>${tr.now!=null?tr.now.toFixed(1):'—'}</b><span>kg average</span></div>
        <div><b>${tr.rate!=null?(tr.rate>=0?'+':'')+tr.rate.toFixed(2):'—'}</b><span>kg per week</span></div>
        <div><b>${adh}%</b><span>last 7 days</span></div>
      </div>
      <svg viewBox="0 0 660 140" class="spark" role="img"><line x1="0" y1="120" x2="660" y2="120" class="axis"></line><polyline class="sparkline" points="${points}"></polyline>${dots}</svg>
      <p class="verdict ${verdictCls}">${verdictTxt}</p>
    </div>
    <div class="block">
      <div class="block-h"><h3>Protocol start date</h3></div>
      <p class="block-p">Sets which calorie phase applies. Change once, then leave it.</p>
      <input class="date-input" type="date" id="startInput" value="${startISO}">
    </div>
  `;

  document.getElementById('weightInput').onchange = (e) => { day().weight = e.target.value; persist(); renderAll(); };
  document.getElementById('startInput').onchange = (e) => { startISO = e.target.value; saveJSON('loading_start_v1', startISO); renderAll(); };
}

/* ============ RENDER: WHY ============ */
function renderWhy(){
  let html = `<div class="note">Read this once properly, then stop reading it. Understanding the plan is not the same as running it, and for a certain kind of mind the reading is a very comfortable place to hide.</div>`;
  WHY.forEach(w => { html += `<section class="why"><h3>${w.h}</h3><p>${w.b}</p></section>`; });
  document.getElementById('main').innerHTML = html;
}

/* ============ MASTER RENDER ============ */
function renderAll(){
  renderHeader();
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if(tab==='fuel') renderFuel();
  else if(tab==='train') renderTrain();
  else if(tab==='weigh') renderWeigh();
  else renderWhy();
}

document.querySelectorAll('.tab').forEach(b => { b.onclick = () => { tab = b.dataset.tab; renderAll(); }; });
document.getElementById('prevDay').onclick = () => { date = iso(addDays(new Date(date+'T12:00:00'), -1)); renderAll(); };
document.getElementById('nextDay').onclick = () => { date = iso(addDays(new Date(date+'T12:00:00'), 1)); renderAll(); };

renderAll();
</script>
